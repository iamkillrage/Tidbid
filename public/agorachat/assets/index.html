<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Agora Chat Examples</title>
    <script type="module" src="/index.js"></script>
</head>

<body>
    <h2>Agora Chat Examples</h2>
    <div>
        <button type="button" id="connect" data-uid="" data-token="">Login</button>
        <button type="button" id="disconnect">Logout</button>
    </div>
    <div class="input-field">
        <label>Peer user ID</label>
        <input type="text" placeholder="Peer user ID" id="peerId">
    </div>
    <div class="input-field">
        <label>Peer Message</label>
        <input type="text" placeholder="Peer message" id="message">
        <button type="button" id="sendMessage">send</button>
    </div>
</body>

</html>
